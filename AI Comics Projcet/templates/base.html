<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}ComicCraft{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">

        <div class="nav-container">

            <a href="/" class="logo">
                ⚡ ComicCraft
            </a>

            <nav>
                <a href="/">Home</a>
                <a href="/#create">Create Comic</a>
                <a href="/#about">About</a>
            </nav>

        </div>

    </header>


    <!-- Main Content -->
    <main>

        {% block content %}
        {% endblock %}

    </main>


    <!-- Footer -->
    <footer class="footer">

        <p>
            © 2026 ComicCraft — AI Comic Story Creator
        </p>

    </footer>

</body>

</html>
